<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#215984" />
      <stop offset="45%" stop-color="#296E9D" />
      <stop offset="100%" stop-color="#1B4B70" />
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Latar Belakang Biru Khas Portal -->
  <rect width="1440" height="900" fill="url(#portalBg)" />

  <!-- Geometris Balok Abstrak di Belakang Kartu (Persis seperti gambar referensi) -->
  <g id="portal-blocks" filter="url(#blurSoft)">
    <!-- Balok Hijau/Teal Kiri -->
    <rect x="470" y="210" width="90" height="90" rx="10" fill="#10B981" opacity="0.65" />
    <rect x="470" y="600" width="90" height="90" rx="10" fill="#10B981" opacity="0.65" />

    <!-- Balok Biru Muda Kiri Panjang -->
    <rect x="370" y="380" width="190" height="110" rx="10" fill="#38BDF8" opacity="0.45" />

    <!-- Balok Biru Atas-Bawah -->
    <rect x="580" y="150" width="120" height="90" rx="10" fill="#60A5FA" opacity="0.40" />
    <rect x="740" y="150" width="120" height="90" rx="10" fill="#60A5FA" opacity="0.35" />
    <rect x="580" y="660" width="120" height="90" rx="10" fill="#60A5FA" opacity="0.40" />
    <rect x="740" y="660" width="120" height="90" rx="10" fill="#60A5FA" opacity="0.35" />

    <!-- Balok Hijau/Teal Kanan -->
    <rect x="880" y="210" width="90" height="90" rx="10" fill="#10B981" opacity="0.65" />
    <rect x="880" y="600" width="90" height="90" rx="10" fill="#10B981" opacity="0.65" />

    <!-- Balok Biru Muda Kanan Panjang -->
    <rect x="880" y="380" width="190" height="110" rx="10" fill="#38BDF8" opacity="0.45" />

    <!-- Balok Tambahan Sisi Kiri & Kanan -->
    <rect x="390" y="510" width="140" height="70" rx="10" fill="#2563EB" opacity="0.30" />
    <rect x="910" y="510" width="140" height="70" rx="10" fill="#2563EB" opacity="0.30" />
    <rect x="390" y="295" width="140" height="70" rx="10" fill="#2563EB" opacity="0.30" />
    <rect x="910" y="295" width="140" height="70" rx="10" fill="#2563EB" opacity="0.30" />
  </g>
</svg>
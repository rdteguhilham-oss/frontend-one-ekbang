<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradasi Dasar Latar Belakang -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142C48" />
      <stop offset="45%" stop-color="#1E456E" />
      <stop offset="100%" stop-color="#0E2137" />
    </linearGradient>

    <!-- Gradasi Gelombang Biru Cyan -->
    <linearGradient id="waveCyan" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.60" />
    </linearGradient>

    <!-- Gradasi Gelombang Royal Sapphire -->
    <linearGradient id="waveRoyal" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.80" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.75" />
    </linearGradient>

    <!-- Gradasi Gelombang Emerald Khas Ekbang -->
    <linearGradient id="waveEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.60" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.40" />
    </linearGradient>

    <!-- Filter Blur Lembut untuk Efek Aliran Cahaya -->
    <filter id="waveBlurDeep" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38" />
    </filter>

    <filter id="waveBlurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Latar Belakang Dasar -->
  <rect width="1440" height="900" fill="url(#bgBase)" />

  <!-- LAPISAN GELOMBANG DENGAN EFEK BLUR MENDALAM -->
  <g filter="url(#waveBlurDeep)">
    <!-- Gelombang 1: Alur Bawah Kiri ke Kanan Atas -->
    <path d="M -100,550 C 250,750 450,300 800,450 C 1150,600 1300,350 1550,400 L 1550,950 L -100,950 Z" 
          fill="url(#waveRoyal)" />

    <!-- Gelombang 2: Alur Melengkung Cyan Terang -->
    <path d="M -80,300 C 300,100 550,550 950,280 C 1250,100 1400,350 1550,200 L 1550,950 L -80,950 Z" 
          fill="url(#waveCyan)" />

    <!-- Gelombang 3: Sentuhan Emerald Alami Ekbang -->
    <path d="M -50,700 C 350,500 650,850 1050,620 C 1300,500 1450,700 1550,650 L 1550,950 L -50,950 Z" 
          fill="url(#waveEmerald)" />
  </g>

  <!-- LAPISAN PITA GELOMBANG AKSEN (SEMI BLUR) -->
  <g filter="url(#waveBlurSoft)" opacity="0.65">
    <path d="M -100,420 C 320,580 580,220 920,380 C 1200,500 1380,280 1550,320" 
          fill="none" stroke="#67E8F9" stroke-width="26" />

    <path d="M -80,580 C 280,380 620,720 1020,480 C 1260,350 1420,550 1550,480" 
          fill="none" stroke="#34D399" stroke-width="18" />
  </g>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradasi Biru Korporat Elegan -->
    <linearGradient id="ekbangBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4265" />
      <stop offset="45%" stop-color="#245A86" />
      <stop offset="100%" stop-color="#153653" />
    </linearGradient>

    <!-- Radial Glow Lembut di Tengah Kartu -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#1E3A8A" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#153653" stop-opacity="0" />
    </radialGradient>

    <!-- Filter Halus untuk Geometri -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Latar Dasar -->
  <rect width="1440" height="900" fill="url(#ekbangBg)" />
  <rect width="1440" height="900" fill="url(#centerGlow)" />

  <!-- Garis Koneksi Data Terintegrasi Ekbang -->
  <g id="ekbang-lines">
    <line x1="380" y1="300" x2="480" y2="220" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />

    <line x1="330" y1="450" x2="460" y2="560" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="460" y1="560" x2="360" y2="670" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="480" y1="220" x2="620" y2="140" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="1060" y1="300" x2="960" y2="220" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="1060" y1="300" x2="1110" y2="450" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="1110" y1="450" x2="980" y2="560" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="980" y1="560" x2="1080" y2="670" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="960" y1="220" x2="820" y2="140" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1.2" stroke-dasharray="4,4" />
  </g>


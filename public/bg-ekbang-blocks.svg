<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradasi Biru Portal Teduh & Ramah -->
    <linearGradient id="portalBlueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F537C" />
      <stop offset="45%" stop-color="#286997" />
      <stop offset="100%" stop-color="#184365" />
    </linearGradient>

    <!-- Filter Soft Blur untuk Efek Latar Belakang Fokus -->
    <filter id="softBlockBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Glow Halus di Tengah -->
    <radialGradient id="cardGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#184365" stop-opacity="0" />
    </radialGradient>

    <!-- Animasi Mengambang Lembut pada Balok -->
    <style>
      @keyframes floatAscending {
        0% {
          transform: translateY(0px) scale(1);
        }
        50% {
          transform: translateY(-8px) scale(1.012);
        }
        100% {
          transform: translateY(0px) scale(1);
        }
      }
      #ekbang-ascending-blocks {
        transform-origin: 720px 450px;
        animation: floatAscending 9s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Latar Belakang Dasar -->
  <rect width="1440" height="900" fill="url(#portalBlueBg)" />
  <rect width="1440" height="900" fill="url(#cardGlow)" />

  <!-- BALOK-BALOK MODULAR BERTINGKAT EKONOMI & PEMBANGUNAN -->
  <g id="ekbang-ascending-blocks" filter="url(#softBlockBlur)">

    <!-- SISI KIRI (TINGKAT BAWAH - MENENGAH) -->
    <rect x="270" y="430" width="120" height="75" rx="12" fill="#2563EB" fill-opacity="0.32" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
    <rect x="360" y="530" width="140" height="95" rx="12" fill="#0284C7" fill-opacity="0.45" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />
    <rect x="420" y="370" width="160" height="110" rx="12" fill="#38BDF8" fill-opacity="0.48" stroke="rgba(255,255,255,0.30)" stroke-width="1.2" />
    
    <!-- Aksen Emas/Kuning Khas Bandung Kiri -->
    <rect x="460" y="240" width="115" height="90" rx="12" fill="#F59E0B" fill-opacity="0.48" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" />
    <rect x="380" y="180" width="85" height="70" rx="10" fill="#10B981" fill-opacity="0.40" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />

    <!-- AREA ATAS & BAWAH PUSAT (FRAME KARTU) -->
    <rect x="630" y="110" width="180" height="85" rx="12" fill="#38BDF8" fill-opacity="0.38" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />
    <rect x="630" y="700" width="180" height="85" rx="12" fill="#0284C7" fill-opacity="0.35" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />

    <!-- SISI KANAN (TINGKAT MENENGAH - TINGGI MENANJAK) -->
    <!-- Aksen Emas/Kuning Khas Bandung Kanan (Tinggi) -->
    <rect x="910" y="160" width="130" height="95" rx="12" fill="#F59E0B" fill-opacity="0.52" stroke="rgba(255,255,255,0.38)" stroke-width="1.2" />
    <rect x="870" y="280" width="165" height="110" rx="12" fill="#38BDF8" fill-opacity="0.50" stroke="rgba(255,255,255,0.30)" stroke-width="1.2" />
    <rect x="890" y="420" width="155" height="95" rx="12" fill="#10B981" fill-opacity="0.42" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />
    <rect x="950" y="540" width="140" height="90" rx="12" fill="#2563EB" fill-opacity="0.35" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
    <rect x="1060" y="340" width="115" height="80" rx="12" fill="#38BDF8" fill-opacity="0.36" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />

  </g>
</svg>